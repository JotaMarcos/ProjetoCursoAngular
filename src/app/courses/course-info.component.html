<h2>{{ course?.id ? 'Course Info' : 'Cadastrar Curso' }}</h2>

<hr>

<form #courseForm="ngForm" *ngIf="course">

    <p *ngIf="!course.id" class="text-muted">
        <span class="fa-solid fa-image me-1"></span>
        A imagem do curso será buscada automaticamente na web a partir do nome ao salvar.
    </p>

    <div class="row mb-3">
        <label class="col-sm-2 col-form-label">Name:</label>
        <div class="col-sm-10">
            <input [(ngModel)]="course.name" required name="name" #courseName="ngModel" [ngClass]="{'is-invalid': courseName.invalid && courseName.touched}" class="form-control">

            <div class="invalid-feedback">
                <span>Course name is required</span>
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-2 col-form-label">Price:</label>
        <div class="col-sm-10">
            <input [(ngModel)]="course.price" required name="price" #coursePrice="ngModel" type="number" [ngClass]="{'is-invalid': coursePrice.invalid && coursePrice.touched}" class="form-control">
            <div class="invalid-feedback">
                <span>Course price is required</span>
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-2 col-form-label">Rating:</label>
        <div class="col-sm-10">
                <input [(ngModel)]="course.rating" required name="rating" #courseRating="ngModel" type="number" [ngClass]="{'is-invalid': courseRating.invalid && courseRating.touched}" class="form-control">
                <div class="invalid-feedback">
                    <span>Course rating is required</span>
                </div>
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-2 col-form-label">Description:</label>
        <div class="col-sm-10">
            <textarea [(ngModel)]="course.description" required name="description" #courseDescription="ngModel" [ngClass]="{'is-invalid': courseDescription.invalid && courseDescription.touched}" class="form-control"></textarea>
            <div class="invalid-feedback">
                <span>Course description is required</span>
            </div>
        </div>
    </div>

    <button type="button" [disabled]="courseForm.invalid" (click)="save()" class="btn btn-primary me-2">Save</button>
    <button type="button" [routerLink]="['/courses']" class="btn btn-secondary">Back</button>



</form>
