<div class="d-flex justify-content-between align-items-center">
    <h2>Course List</h2>
    <a [routerLink]="['/course/new']" class="btn btn-success">Cadastrar</a>
</div>
<div class="row mb-3">
        <label class="col-sm-2 col-form-label">Filter By: </label>
        <div class="col-sm-10">
                <input [(ngModel)]="filter" class="form-control">
        </div>
</div>

<div class="table-responsive">
<table class='table table-striped align-middle'>
    <thead>
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Code</th>
            <th>ReleaseDate</th>
            <th>Rating</th>
            <th>Options</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let course of filteredCourses">
            <td><img [src]="course.imageUrl" [alt]="course.name" width="40" height="40"></td>
            <td>{{ course.name }}</td>
            <td>{{ course.price }}</td>
            <td>{{ course.code | lowercase | replace: '-':' ' }}</td>
            <td>{{ course.releaseDate | date: 'dd/MM/yyyy' }}</td>
            <td>
                <app-star [rating]="course.rating"></app-star>
            </td>
            <td class="text-nowrap">
                <a [routerLink]="['/course/info', course.id]" class="btn btn-primary me-2">Editar</a>
                <button (click)="deleteById(course.id)" class="btn btn-danger">Delete</button>
            </td>
        </tr>
    </tbody>


</table>
</div>
